service: wedding_app

image: wedding_app

servers:
  web:
    - 51.210.247.103

proxy:
  ssl: true
  host: vps-d48c918a.vps.ovh.net

registry:
  server: localhost:5555

env:
  secret:
    - RAILS_MASTER_KEY
  clear:
    APP_HOST: vps-d48c918a.vps.ovh.net
    SOLID_QUEUE_IN_PUMA: true

aliases:
  console: app exec --interactive --reuse "bin/rails console"
  shell: app exec --interactive --reuse "bash"
  logs: app logs -f
  dbc: app exec --interactive --reuse "bin/rails dbconsole"

volumes:
  - "wedding_app_storage:/rails/storage"

asset_path: /rails/public/assets

builder:
  arch: amd64

ssh:
  user: root
