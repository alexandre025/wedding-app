    schedule:
      title: Programme
      eyebrow: Le parcours du week-end
      subtitle: Tout le week-end au Domaine de la Ferme au Moulin · Pont-Saint-Mard
      days:
        - badge: Étape 1
          label: Samedi
          date: 1er juillet
          start_marker: Départ
          items:
            - time: 15h30
              name: Cérémonie laïque
              body: On échange nos vœux, entourés de celles et ceux qu’on aime.
            - time: 17h00
              name: Vin d’honneur & scène musicale ouverte
              body: On trinque ensemble, et la scène est ouverte à celles et ceux qui veulent jouer ou chanter.
            - time: 20h30
              name: Repas & soirée dansante
              body: On passe à table tous ensemble, puis place à la piste de danse.
        - badge: Étape 2
          label: Dimanche
          date: 2 juillet
          end_marker: Arrivée
          items:
            - time: 10h00
              name: Le 5K des mariés
              body: 5 km à votre rythme, en courant, pour bien commencer la journée.
              highlight: true
            - time: 11h00
              name: Brunch
              body: Un dernier moment tout en douceur avant de se dire au revoir.
      infos_title: Infos pratiques
      info_cards:
