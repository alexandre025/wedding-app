# PostgreSQL for local development and test. Production is deployed with Kamal
# and uses its own database, so this file is development-only.
#
#   docker compose up -d
#
name: wedding-app

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: wedding_app
      POSTGRES_PASSWORD: wedding_app
      POSTGRES_DB: wedding_app_development
    ports:
      - "5432:5432"
    volumes:
      - postgres:/var/lib/postgresql
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U wedding_app" ]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres:
